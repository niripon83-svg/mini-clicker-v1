<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grape Kombat</title>
<script src="https://telegram.org"></script>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
body { margin: 0; padding: 0; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: manipulation; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
.pill { background: #1c1f24; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
.board { flex: 1; background: #1c1f24; border-top: 2px solid #f3ba2f; border-radius: 30px 30px 0 0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.box { background: #272a2f; border-radius: 12px; padding: 8px; text-align: center; }
.lbl { font-size: 10px; color: #aaa; margin-bottom: 4px; }
.val { font-size: 14px; font-weight: bold; }
.bal { text-align: center; font-size: 38px; font-weight: 900; margin: 8px 0; color: #f3ba2f; }
.bar-bg { width: 100%; height: 8px; background: #272a2f; border-radius: 10px; overflow: hidden; }
.bar-fill { height: 100%; width: 10%; background: linear-gradient(90deg, #a855f7, #f3ba2f); }
.zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.btn-outer { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #581c87, #0f172a); padding: 12px; box-shadow: 0 0 30px rgba(147,51,234,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.btn-outer:active { transform: scale(0.93); }
.btn-inner { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #7e22ce, #3b0764); border: 4px solid #a855f7; display: flex; align-items: center; justify-content: center; font-size: 100px; pointer-events: none; }
.float { position: absolute; font-size: 26px; font-weight: bold; color: #fff; pointer-events: none; animation: up 0.7s ease-out forwards; }
@keyframes up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }
.energy { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #272a2f; padding: 6px; border-radius: 14px; }
.nav button { background: #1c1f24; border: none; color: #fff; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
.modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); padding: 20px; flex-direction: column; justify-content: flex-end; z-index: 10; }
.modal.open { display: flex; }
.sheet { background: #1c1f24; border-top: 2px solid #a855f7; border-radius: 24px 24px 0 0; padding: 20px; }
.item { background: #272a2f; padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.buy { background: #9333ea; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
.buy:disabled { background: #444; color: #888; }
</style>
</head>
<body>

<div class="top">
  <div class="pill" id="uname">🍇 Grape CEO</div>
  <div class="pill" id="rank">Seedling</div>
</div>

<div class="board">
  <div>
    <div class="stats">
      <div class="box"><div class="lbl">Tap Power</div><div class="val">+<span id="tapVal">1</span></div></div>
      <div class="box"><div class="lbl">Next Level</div><div class="val" id="nextVal">5,000</div></div>
      <div class="box"><div class="lbl">Profit / Hr</div><div class="val">+<span id="pphVal">0</span></div></div>
    </div>
    <div class="bal">🍇 <span id="score">0</span></div>
    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
  </div>

  <div class="zone" id="zone">
    <div class="btn-outer" id="grape">
      <div class="btn-inner">🍇</div>
    </div>
  </div>

  <div>
    <div class="energy">
      <span>⚡ <span id="enVal">1000</span> / <span id="maxEnVal">1000</span></span>
      <span style="color:#a855f7; cursor:pointer;" onclick="openModal('boost')">🚀 Boost</span>
    </div>
    <div class="nav">
      <button onclick="closeModals()">🍇 Tap</button>
      <button onclick="openModal('mine')">⛏️ Mine</button>
      <button onclick="openModal('boost')">⚡ Upgrades</button>
    </div>
  </div>

  <div class="modal" id="mine">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <b>⛏️ Vineyard Cards</b><span onclick="closeModals()" style="cursor:pointer;">✕</span>
      </div>
      <div id="cards"></div>
    </div>
  </div>

  <div class="modal" id="boost">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <b>🚀 Boosters</b><span onclick="closeModals()" style="cursor:pointer;">✕</span>
      </div>
      <div class="item">
        <div><b>⚡ Full Energy</b><br><small style="color:#aaa">Refill 100% now</small></div>
        <button class="buy" onclick="refill()">Free</button>
      </div>
      <div class="item">
        <div><b>👆 Multitap</b><br><small style="color:#aaa">+1 per tap</small></div>
        <button class="buy" id="tapBtn" onclick="buyTap()">100</button>
      </div>
      <div class="item">
        <div><b>🔋 Max Energy</b><br><small style="color:#aaa">+500 limit</small></div>
        <button class="buy" id="enBtn" onclick="buyEn()">200</button>
      </div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    document.getElementById('uname').innerText = '🍇 ' + (tg.initDataUnsafe.user.first_name || 'CEO');
  }
}

let s = JSON.parse(localStorage.getItem('gk_clean')) || {
  score: 0, tap: 1, en: 1000, maxEn: 1000, pph: 0, tapCost: 100, enCost: 200,
  cards: [
    { name: '🌱 Organic Soil', pph: 150, cost: 150, lvl: 0 },
    { name: '🍷 Grape Press', pph: 600, cost: 600, lvl: 0 },
    { name: '⛓️ Purple Chain', pph: 2500, cost: 2500, lvl: 0 }
  ]
};

function save() { localStorage.setItem('gk_clean', JSON.stringify(s)); }

function ui() {
  document.getElementById('score').innerText = Math.floor(s.score).toLocaleString();
  document.getElementById('tapVal').innerText = s.tap;
  document.getElementById('pphVal').innerText = s.pph.toLocaleString();
  document.getElementById('enVal').innerText = Math.floor(s.en);
  document.getElementById('maxEnVal').innerText = s.maxEn;
  document.getElementById('tapBtn').innerText = '🍇 ' + s.tapCost;
  document.getElementById('tapBtn').disabled = s.score < s.tapCost;
  document.getElementById('enBtn').innerText = '🍇 ' + s.enCost;
  document.getElementById('enBtn').disabled = s.score < s.enCost;

  let next = 5000, r = 'Seedling';
  if (s.score >= 50000) { next = 250000; r = 'Grape Baron'; }
  else if (s.score >= 5000) { next = 50000; r = 'Winemaker'; }
  document.getElementById('rank').innerText = r;
  document.getElementById('nextVal').innerText = next.toLocaleString();
  document.getElementById('bar').style.width = Math.min(100, (s.score / next) * 100) + '%';

  const cDiv = document.getElementById('cards');
  cDiv.innerHTML = '';
  s.cards.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<div><b>${c.name} (Lvl ${c.lvl})</b><br><small style="color:#aaa">+${c.pph}/hr</small></div>
      <button class="buy" ${s.score < c.cost ? 'disabled' : ''} onclick="buyCard(${i})">🍇 ${c.cost}</button>`;
    cDiv.appendChild(row);
  });
  save();
}

function tap(x, y) {
  if (s.en >= s.tap) {
    s.score += s.tap;
    s.en -= s.tap;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    const z = document.getElementById('zone');
    const rect = z.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float';
    el.innerText = '+' + s.tap;
    el.style.left = (x - rect.left - 15) + 'px';
    el.style.top = (y - rect.top - 20) + 'px';
    z.appendChild(el);
    setTimeout(() => el.remove(), 700);
    ui();
  }
}

const g = document.getElementById('grape');
let lastT = 0;
g.addEventListener('touchstart', e => {
  e.preventDefault();
  lastT = Date.now();
  for (let t of e.changedTouches) tap(t.clientX, t.clientY);
}, { passive: false });
g.addEventListener('click', e => { if (Date.now() - lastT > 350) tap(e.clientX, e.clientY); });

function buyCard(i) {
  let c = s.cards[i];
  if (s.score >= c.cost) {
    s.score -= c.cost; s.pph += c.pph; c.lvl++;
    c.cost = Math.floor(c.cost * 1.7); c.pph = Math.floor(c.pph * 1.3);
    ui();
  }
}
function refill() { s.en = s.maxEn; ui(); closeModals(); }
function buyTap() { if (s.score >= s.tapCost) { s.score -= s.tapCost; s.tap++; s.tapCost = Math.floor(s.tapCost * 2); ui(); } }
function buyEn() { if (s.score >= s.enCost) { s.score -= s.enCost; s.maxEn += 500; s.enCost = Math.floor(s.enCost * 2); ui(); } }
function openModal(id) { closeModals(); document.getElementById(id).classList.add('open'); }
function closeModals() { document.getElementById('mine').classList.remove('open'); document.getElementById('boost').classList.remove('open'); }

setInterval(() => {
  if (s.en < s.maxEn) s.en = Math.min(s.maxEn, s.en + 3);
  if (s.pph > 0) s.score += s.pph / 3600;
  ui();
}, 1000);

ui();
</script>
</body>
</html>
