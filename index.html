<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grape Kombat</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #000000;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1c1f24;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .league-pill {
      background: linear-gradient(90deg, #6b21a8, #9333ea);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    /* Main Curved Container (Hamster Kombat Style) */
    .main-card {
      flex: 1;
      background: #1c1f24;
      border-top: 2px solid #f3ba2f;
      border-radius: 36px 36px 0 0;
      box-shadow: 0 -8px 30px rgba(243, 186, 47, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    /* 3 Top Stat Boxes */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-box {
      background: #272a2f;
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }
    .stat-label { font-size: 10px; font-weight: 600; margin-bottom: 4px; }
    .lbl-orange { color: #f79841; }
    .lbl-purple { color: #a855f7; }
    .lbl-green { color: #4ade80; }
    .stat-val { font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; }

    /* Balance Display */
    .balance-area {
      text-align: center;
      margin: 6px 0;
    }
    .balance-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .coin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, #fde047, #eab308);
      border-radius: 50%;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
    }
    .level-progress {
      width: 100%;
      margin-top: 6px;
    }
    .level-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .prog-bg {
      width: 100%;
      height: 8px;
      background: #272a2f;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .prog-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #a855f7, #f3ba2f);
      transition: width 0.2s;
    }

    /* Giant Grape Tap Circle */
    .tap-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }
    .outer-ring {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, #581c87 0%, #1e1b4b 70%, #0f172a 100%);
      padding: 12px;
      box-shadow: 0 0 35px rgba(147, 51, 234, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.06s ease;
    }
    .outer-ring:active {
      transform: scale(0.94);
    }
    .inner-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7e22ce, #3b0764);
      border: 4px solid #a855f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 115px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
    }

    /* Floating +1 animation */
    .float-num {
      position: absolute;
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(168, 85, 247, 0.9);
      animation: floatUp 0.8s ease-out forwards;
      z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.2); }
    }

    /* Energy & Boost Row */
    .energy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .energy-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .boost-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    /* Bottom Navigation Bar (Mine / Upgrades) */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #272a2f;
      padding: 6px;
      border-radius: 16px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 8px 4px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #1c1f24;
      color: #ffffff;
    }
    .nav-icon { font-size: 18px; }

    /* Modal for Mine / Upgrades */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      flex-direction: column;
      justify-content: flex-end;
    }
    .modal.open { display: flex; }
    .modal-sheet {
      background: #1c1f24;
      border-top: 2px solid #a855f7;
      border-radius: 28px 28px 0 0;
      padding: 20px 16px 28px;
      max-height: 75vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 18px; font-weight: 800; }
    .close-btn {
      background: #272a2f;
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .card-item {
      background: #272a2f;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-left { display: flex; align-items: center; gap: 10px; }
    .card-emoji { font-size: 30px; }
    .card-name { font-size: 14px; font-weight: 700; }
    .card-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .buy-btn {
      background: linear-gradient(90deg, #9333ea, #7e22ce);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .buy-btn:disabled { background: #374151; color: #6b7280; }
  </style>
</head>
<body>

  <!-- Top User Bar -->
  <div class="top-bar">
    <div class="user-pill">
      <span>🍇</span>
      <span id="playerName">Grape CEO</span>
    </div>
    <div class="league-pill" id="leagueBadge">Vineyard League</div>
  </div>

  <!-- Main Hamster-Style Curved Board -->
  <div class="main-card">
    
    <!-- 3 Top Stat Boxes -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label lbl-orange">Earn per tap</div>
        <div class="stat-val">🍇 +<span id="tapPowerVal">1</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label lbl-purple">Coins to level up</div>
        <div class="stat-val" id="nextLevelVal">5K</div>
      </div>
      <div class="stat-box">
        <div class="stat-label lbl-green">Profit per hour</div>
        <div class="stat-val">🍇 +<span id="pphVal">0</span></div>
      </div>
    </div>

    <!-- Coin Balance & Progress Bar -->
    <div class="balance-area">

      <div class="level-progress">

          <span id="rankName">Seedling &gt;</span>
          <span>Level <span id="levelNum">1</span>/10</span>

        <div class="prog-bg">
          <div class="prog-fill" id="levelBar"></div>
        </div>
      </div>
    </div>

    <!-- Giant Grape Tap Button -->
    <div class="tap-zone" id="tapZone">
      <div class="outer-ring" id="grapeBtn">
        <div class="inner-ring">🍇</div>
      </div>
    </div>

    <!-- Energy & Boost -->
    <div>
      <div class="energy-row">
        <div class="energy-info">
          <span>⚡</span>
          <span><span id="energyVal">1000</span> / <span id="maxEnergyVal">1000</span></span>
        </div>
        <button class="boost-btn" id="openBoostBtn">
          <span>🚀</span>
          <span>Boost</span>
        </button>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottom-nav">
        <button class="nav-btn active" onclick="closeModals()">
          <span class="nav-icon">🍇</span>
          <span>Exchange</span>
        </button>
        <button class="nav-btn" onclick="openMineModal()">
          <span class="nav-icon">⛏️</span>
          <span>Mine</span>
