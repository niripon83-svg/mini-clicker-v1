<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grape Kombat</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #000000;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1c1f24;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .sound-btn {
      background: #1c1f24;
      border: 1px solid #374151;
      color: #fff;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Main Curved Game Board */
    .main-card {
      flex: 1;
      background: #1c1f24;
      border-top: 2px solid #f3ba2f;
      border-radius: 32px 32px 0 0;
      box-shadow: 0 -8px 30px rgba(243, 186, 47, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Top 3 Stat Boxes */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-box {
      background: #272a2f;
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }
    .stat-label { font-size: 10px; font-weight: 600; margin-bottom: 3px; }
    .lbl-orange { color: #f79841; }
    .lbl-purple { color: #c084fc; }
    .lbl-green { color: #4ade80; }
    .stat-val {
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Quick Action Bar (Daily Reward & Cipher) */
    .daily-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .daily-card {
      background: #272a2f;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .daily-card:active { transform: scale(0.97); }
    .daily-info { text-align: left; }
    .daily-title { font-size: 12px; font-weight: 700; color: #fff; }
    .daily-sub { font-size: 10px; color: #f3ba2f; font-weight: 600; }
    .daily-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }
    .daily-badge.claimed { background: #4b5563; box-shadow: none; }

    /* Balance & Level Bar */
    .balance-area {
      text-align: center;
      margin: 4px 0;
    }
    .balance-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .coin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #fde047, #eab308);
      border-radius: 50%;
      font-size: 17px;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
    }
    .level-progress { width: 100%; margin-top: 4px; }
    .level-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .prog-bg {
      width: 100%;
      height: 8px;
      background: #272a2f;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #374151;
    }
    .prog-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #a855f7, #f3ba2f);
      transition: width 0.2s;
    }

    /* Interactive Grape Tap Circle */
    .tap-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
      min-height: 210px;
    }
    .outer-ring {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #581c87 0%, #1e1b4b 70%, #0f172a 100%);
      padding: 12px;
      box-shadow: 0 0 35px rgba(147, 51, 234, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .outer-ring.tapped { transform: scale(0.93); }
    .inner-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7e22ce, #3b0764);
      border: 4px solid #a855f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 105px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    /* Floating +1 Text */
    .float-num {
      position: absolute;
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(168, 85, 247, 1);
      animation: floatUp 0.75s ease-out forwards;
      z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-95px) scale(1.25); }
    }

    /* Energy & Boost Row */
    .energy-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .energy-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .boost-btn {
      background: #272a2f;
      border: 1px solid #a855f7;
      border-radius: 14px;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .boost-btn:active { transform: scale(0.95); }

    /* Bottom Navigation */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #272a2f;
      padding: 6px;
      border-radius: 16px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 8px 4px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active {
      background: #1c1f24;
      color: #ffffff;
    }
    .nav-icon { font-size: 18px; }

    /* Modals */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 100;
      flex-direction: column;
      justify-content: flex-end;
    }
    .modal.open { display: flex; }
    .modal-sheet {
      background: #1c1f24;
      border-top: 2px solid #a855f7;
      border-radius: 28px 28px 0 0;
      padding: 20px 16px 28px;
      max-height: 78vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 18px; font-weight: 800; }
    .close-btn {
      background: #272a2f;
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .card-item {
      background: #272a2f;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-left { display: flex; align-items: center; gap: 10px; }
    .card-emoji { font-size: 28px; }
    .card-name { font-size: 14px; font-weight: 700; }
    .card-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .buy-btn {
      background: linear-gradient(90deg, #9333ea, #7e22ce);
      border: none;
      color: #fff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .buy-btn:disabled { background: #374151; color: #6b7280; }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: #272a2f;
      border: 1px solid #f3ba2f;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="toast" id="toastMsg"></div>

  <!-- Top User Bar -->
  <div class="top-bar">
    <div class="user-pill">
      <span>🍇</span>
      <span id="playerName">Grape CEO</span>
    </div>
    <button class="sound-btn" id="soundToggle">🔊 Sound: ON</button>
  </div>

  <!-- Main Game Board -->
  <div class="main-card">
    <div>
      <!-- 3 Top Stat Boxes -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label lbl-orange">Earn per tap</div>
          <div class="stat-val">🍇 +<span id="tapPowerVal">1</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label lbl-purple">Coins to level up</div>
